<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Word Run – Growth</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(180deg, #eef7f1, #f7fbf8);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.card {
  background: white;
  border-radius: 24px;
  padding: 30px;
  width: 320px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,.1);
}

.plant {
  font-size: 80px;
  margin-bottom: 10px;
}

.progress-bar {
  height: 10px;
  background: #e0efe6;
  border-radius: 10px;
  overflow: hidden;
  margin: 15px 0;
}

.progress {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #7ecba1, #4a9f74);
  transition: width 1s ease;
}

.stage {
  font-weight: bold;
  color: #2f5d3a;
}

.days {
  font-size: 14px;
  color: #5f6f65;
}

button {
  margin-top: 20px;
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: #4a9f74;
  color: white;
  font-size: 15px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="card">
  <div id="plant" class="plant">🌱</div>
  <div id="stage" class="stage">Loading...</div>
  <div id="days" class="days"></div>

  <div class="progress-bar">
    <div id="progress" class="progress"></div>
  </div>

  <button onclick="openForm()">Log Today’s Reading</button>
</div>

<script>
const API_URL = "PASTE_YOUR_WEB_APP_URL_HERE";

const params = new URLSearchParams(window.location.search);
const name = params.get("name");

if (!name) {
  document.body.innerHTML = "No name provided.";
}

fetch(`${API_URL}?name=${encodeURIComponent(name)}`)
  .then(res => res.json())
  .then(data => {
    const daysRead = data.daysRead;
    const percent = (daysRead / 90) * 100;

    document.getElementById("days").innerText =
      `${daysRead} of 90 days completed`;

    document.getElementById("progress").style.width = percent + "%";

    const plant = document.getElementById("plant");
    const stage = document.getElementById("stage");

    if (daysRead <= 5) {
      plant.innerText = "🌰";
      stage.innerText = "Seed Stage";
    } else if (daysRead <= 15) {
      plant.innerText = "🌱";
      stage.innerText = "Sprouting Faith";
    } else if (daysRead <= 30) {
      plant.innerText = "🌿";
      stage.innerText = "Growing Strong";
    } else if (daysRead <= 60) {
      plant.innerText = "🌳";
      stage.innerText = "Deeply Rooted";
    } else {
      plant.innerText = "🌲";
      stage.innerText = "Flourishing";
    }
  });

function openForm() {
  window.open("PASTE_YOUR_GOOGLE_FORM_URL", "_blank");
}
</script>

</body>
</html>
